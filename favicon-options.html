<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favicon 設計提案</title>
<style>
:root { --deep:#092b35; --danube:#123b4a; --gold:#c6933b; --cream:#f5eddc; --paper:#fffdf7; --ink:#26373a; --muted:#6e7a79; --line:#d9cdb5; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; padding:52px 20px; color:var(--ink); background:var(--cream); background-image:linear-gradient(rgba(18,59,74,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(18,59,74,.035) 1px,transparent 1px); background-size:24px 24px; font-family:"Avenir Next","Noto Sans TC",sans-serif; }
main { width:min(100%,920px); margin:auto; }
.eyebrow { color:#a8322d; font-size:11px; font-weight:900; letter-spacing:.18em; text-transform:uppercase; }
h1 { margin:9px 0 10px; color:var(--danube); font:700 clamp(34px,7vw,58px)/1 Georgia,"Noto Serif TC",serif; letter-spacing:-.035em; }
.intro { max-width:620px; margin:0 0 30px; color:var(--muted); line-height:1.7; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.card { overflow:hidden; border:1px solid var(--line); border-radius:10px; background:var(--paper); box-shadow:0 12px 28px rgba(35,47,48,.11); }
.visual { display:grid; min-height:190px; place-items:center; background:linear-gradient(145deg,var(--deep),var(--danube)); }
.visual img { width:104px; height:104px; filter:drop-shadow(0 12px 15px rgba(0,0,0,.25)); }
.content { padding:20px; }
.number { color:#a8322d; font-size:10px; font-weight:900; letter-spacing:.14em; }
h2 { margin:7px 0 8px; color:var(--danube); font:700 22px/1.1 Georgia,"Noto Serif TC",serif; }
p { margin:0; color:var(--muted); font-size:13px; line-height:1.65; }
.tabs { display:flex; gap:12px; margin-top:18px; }
.tab { display:flex; width:46px; height:34px; align-items:center; justify-content:center; border-radius:7px 7px 0 0; background:#e7e7e7; box-shadow:inset 0 -1px #bbb; }
.tab img { width:16px; height:16px; }
.tab.big img { width:32px; height:32px; }
@media(max-width:720px){ body{padding-top:32px}.grid{grid-template-columns:1fr}.visual{min-height:160px}.card{display:grid;grid-template-columns:160px 1fr}.visual img{width:82px;height:82px}.tabs{margin-top:12px} }
@media(max-width:480px){ .card{display:block}.visual{min-height:150px} }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Steven Journey Album · Icon Study</div>
  <h1>頁籤小圖示提案</h1>
  <p class="intro">沿用網站的多瑙河藍綠、奶油紙色、金色與 paprika 紅；下方同時模擬 16px 與 32px 的實際頁籤尺寸。</p>
  <section class="grid">
    <article class="card">
      <div class="visual"><img src="assets/favicon-options/route-compass.svg" alt="羅盤航線圖示"></div>
      <div class="content"><span class="number">OPTION 01</span><h2>羅盤航線</h2><p>最直接的旅行識別，金色指針帶出探索感；小尺寸最清楚。</p><div class="tabs"><span class="tab"><img src="assets/favicon-options/route-compass.svg" alt=""></span><span class="tab big"><img src="assets/favicon-options/route-compass.svg" alt=""></span></div></div>
    </article>
    <article class="card">
      <div class="visual"><img src="assets/favicon-options/journey-album.svg" alt="旅行相簿圖示"></div>
      <div class="content"><span class="number">OPTION 02</span><h2>旅行相簿</h2><p>把路線畫進打開的書頁，最貼合 Journey Album 的品牌名稱。</p><div class="tabs"><span class="tab"><img src="assets/favicon-options/journey-album.svg" alt=""></span><span class="tab big"><img src="assets/favicon-options/journey-album.svg" alt=""></span></div></div>
    </article>
    <article class="card">
      <div class="visual"><img src="assets/favicon-options/steven-route.svg" alt="S 字航跡圖示"></div>
      <div class="content"><span class="number">OPTION 03</span><h2>Steven 航跡</h2><p>以粗體 S 化為旅行路線，個人識別最強，也較不像一般旅遊網站。</p><div class="tabs"><span class="tab"><img src="assets/favicon-options/steven-route.svg" alt=""></span><span class="tab big"><img src="assets/favicon-options/steven-route.svg" alt=""></span></div></div>
    </article>
  </section>
</main>
</body>
</html>
